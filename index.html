<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2563eb">
<meta name="description" content="军理完全体刷题系统：2337题、模拟考试、错题、收藏、章节统计、学习计划、PWA离线">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png">
<title>军理刷题 · 完全体</title>
<style>
:root{--b:#2563eb;--b2:#1d4ed8;--bg:#f4f7fb;--card:#fff;--t:#182235;--m:#718096;--l:#e6ebf2;--g:#16a34a;--r:#dc2626;--o:#ea580c;--sh:0 8px 28px rgba(15,23,42,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:920px;margin:auto;min-height:100vh;padding-bottom:84px}
header{position:sticky;top:0;z-index:20;background:rgba(244,247,251,.93);backdrop-filter:blur(16px);padding:13px 15px;border-bottom:1px solid #e9edf3}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:20px;font-weight:850}.sub{font-size:11px;color:var(--m);margin-top:2px}.gear{border:0;background:#fff;width:40px;height:40px;border-radius:13px;box-shadow:var(--sh)}
main{padding:15px}.page{display:none}.page.on{display:block}.hero{background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;border-radius:24px;padding:20px;box-shadow:0 15px 35px rgba(37,99,235,.2)}.hero h1{margin:0 0 7px;font-size:25px}.hero p{margin:0;line-height:1.65;font-size:13px;opacity:.9}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.stat{background:#fff;border:1px solid var(--l);border-radius:16px;text-align:center;padding:12px 4px}.stat b{display:block;font-size:20px}.stat span{font-size:10px;color:var(--m)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:var(--card);border:1px solid var(--l);border-radius:19px;padding:15px;box-shadow:0 3px 18px rgba(15,23,42,.035)}.action{text-align:left;min-height:96px}.action .big{font-size:23px}.action b{display:block;margin:5px 0;font-size:15px}.action small{color:var(--m);line-height:1.5}.title{font-weight:850;margin:19px 2px 9px}.btn{border:0;border-radius:14px;padding:12px 15px;font-weight:800;background:var(--b);color:#fff}.btn.secondary{background:#eef2ff;color:#3730a3}.btn.ghost{background:#fff;color:var(--t);border:1px solid var(--l)}.btn.danger{background:#fee2e2;color:#991b1b}.btn:disabled{opacity:.45}
.field{width:100%;padding:11px 12px;border-radius:13px;border:1px solid var(--l);background:#fff;outline:none}.field:focus{border-color:#93c5fd}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}.full{grid-column:1/-1}
.progress{height:7px;background:#e7ecf3;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;background:var(--b)}.quizbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.timer{font-variant-numeric:tabular-nums;color:var(--o);font-weight:900}.qcard{background:#fff;border:1px solid var(--l);border-radius:21px;padding:17px;margin-top:12px;box-shadow:var(--sh)}.qmeta{display:flex;justify-content:space-between;color:var(--m);font-size:11px;gap:7px}.qtext{font-size:18px;font-weight:800;line-height:1.65;margin:14px 0}.opt{display:flex;gap:10px;width:100%;text-align:left;background:#fff;border:1px solid var(--l);border-radius:15px;padding:12px;margin:8px 0;line-height:1.55}.opt.sel{background:#eff6ff;border-color:#93c5fd}.opt.ok{background:#f0fdf4;border-color:#86efac}.opt.bad{background:#fef2f2;border-color:#fca5a5}.letter{flex:none;width:27px;height:27px;border-radius:9px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;font-weight:850}.fb{margin-top:10px;padding:11px 12px;border-radius:13px;font-size:13px;line-height:1.55}.fb.ok{background:#f0fdf4;color:#166534}.fb.bad{background:#fef2f2;color:#991b1b}.rowbtn{display:flex;gap:8px;margin-top:12px}.rowbtn>*{flex:1}.answergrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.answergrid button{border:0;border-radius:10px;padding:9px 0;background:#f1f5f9}.answergrid .answered{background:#dbeafe;color:#1d4ed8}.answergrid .right{background:#dcfce7;color:#166534}.answergrid .wrong{background:#fee2e2;color:#991b1b}
.list{display:grid;gap:8px}.item{background:#fff;border:1px solid var(--l);border-radius:15px;padding:13px}.item p{margin:7px 0;line-height:1.55}.pill{display:inline-block;background:#eff6ff;color:var(--b);border-radius:999px;padding:4px 8px;font-size:10px;font-weight:800}.muted{color:var(--m)}.empty{text-align:center;color:var(--m);padding:35px 10px}
.bottom{position:fixed;z-index:30;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(15px);border-top:1px solid var(--l);padding:7px 9px calc(7px + env(safe-area-inset-bottom))}.nav{max-width:920px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.nav button{border:0;background:transparent;color:#7c8798;border-radius:12px;padding:5px 2px;font-size:10px}.nav button.on{background:#eff6ff;color:var(--b);font-weight:850}.nav i{display:block;font-style:normal;font-size:20px;margin-bottom:2px}
.modal{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:60;align-items:flex-end}.modal.on{display:flex}.sheet{background:#fff;width:100%;max-width:920px;margin:auto;border-radius:24px 24px 0 0;padding:18px;max-height:88vh;overflow:auto}.sheet h3{margin:0 0 12px}.sheet .stack{display:grid;gap:8px}
.toast{position:fixed;z-index:100;bottom:92px;left:50%;transform:translate(-50%,10px);opacity:0;background:#111827;color:#fff;border-radius:999px;padding:9px 14px;font-size:12px;transition:.2s}.toast.on{opacity:1;transform:translate(-50%,0)}
.bar{height:7px;background:#edf1f6;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--b)}
.examresult{text-align:center}.score{font-size:54px;font-weight:900;color:var(--b);margin:12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.filters{grid-template-columns:repeat(4,1fr)}.full{grid-column:auto}}
</style>
</head>
<body>
<div class="app">
<header><div class="top"><div><div class="brand">军理刷题 · 完全体</div><div class="sub">2337题库 · 本地学习 · 无需付费</div></div><button class="gear" onclick="settings()">⚙️</button></div></header>
<main>
<section id="home" class="page on"></section>
<section id="practice" class="page"></section>
<section id="wrong" class="page"></section>
<section id="fav" class="page"></section>
<section id="search" class="page"></section>
<section id="stats" class="page"></section>
<section id="quiz" class="page"></section>
</main>
<div class="bottom"><nav class="nav">
<button data-p="home" onclick="go('home')"><i>⌂</i>首页</button>
<button data-p="practice" onclick="go('practice')"><i>◉</i>练习</button>
<button data-p="wrong" onclick="go('wrong')"><i>✕</i>错题</button>
<button data-p="fav" onclick="go('fav')"><i>☆</i>收藏</button>
<button data-p="stats" onclick="go('stats')"><i>▥</i>统计</button>
</nav></div>
</div>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>
<div id="toast" class="toast"></div>
<script src="questions.js"></script>
<script>
const Q=window.BUILTIN_QUESTIONS||[];
const STORE='military_quiz_v4_complete';
const defaults={answered:{},wrong:{},fav:{},attempts:0,right:0,studySeconds:0,days:{},plans:{daily:20},lastDate:'',lastBackup:'',settings:{autoNext:false,showAnswer:true}};
let S=Object.assign({},defaults,JSON.parse(localStorage.getItem(STORE)||'{}'));
S.answered=S.answered||{};S.wrong=S.wrong||{};S.fav=S.fav||{};S.days=S.days||{};S.plans=S.plans||{daily:20};S.settings=Object.assign(defaults.settings,S.settings||{});
let sess=null,installPrompt=null;

function save(){localStorage.setItem(STORE,JSON.stringify(S));}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(x){let e=document.getElementById('toast');e.textContent=x;e.classList.add('on');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove('on'),1700);}
function today(){return new Date().toISOString().slice(0,10);}
function touchDay(){let d=today();if(S.lastDate!==d){S.lastDate=d;S.days[d]=S.days[d]||0;save();}}
function go(id){document.querySelectorAll('.page').forEach(e=>e.classList.remove('on'));document.getElementById(id).classList.add('on');document.querySelectorAll('.nav button').forEach(e=>e.classList.toggle('on',e.dataset.p===id));({home:home,practice:practice,wrong:wrong,fav:fav,search:search,stats:stats,quiz:quiz}[id])();}
function types(){return [...new Set(Q.map(x=>x.type).filter(Boolean))];}
function chapters(){return [...new Set(Q.map(x=>x.chapter).filter(Boolean))];}
function diffs(){return [...new Set(Q.map(x=>x.difficulty).filter(Boolean))];}
function home(){touchDay();let acc=S.attempts?Math.round(S.right/S.attempts*100):0;let answered=Object.keys(S.answered).length;let todayN=S.days[today()]||0;
document.getElementById('home').innerHTML=`<div class="hero"><h1>军理完全体刷题系统</h1><p>你之前的 2337 道题已经全部直接内置。今天刷 ${S.plans.daily} 题，就能稳步清掉题库。</p></div>
<div class="stats"><div class="stat"><b>${Q.length}</b><span>题库</span></div><div class="stat"><b>${answered}</b><span>已练题</span></div><div class="stat"><b>${acc}%</b><span>正确率</span></div><div class="stat"><b>${Object.keys(S.wrong).length}</b><span>错题</span></div></div>
<div class="card"><b>今日进度 ${todayN}/${S.plans.daily}</b><div class="bar" style="margin-top:9px"><i style="width:${Math.min(100,todayN/S.plans.daily*100)}%"></i></div><small class="muted">累计作答 ${S.attempts} 次 · 收藏 ${Object.keys(S.fav).length} 题</small></div>
<div class="title">开始刷题</div><div class="grid">
<button class="card action" onclick="start({n:20,random:true})"><span class="big">🎲</span><b>随机 20 题</b><small>最快进入状态</small></button>
<button class="card action" onclick="start({n:50,random:true})"><span class="big">🔥</span><b>冲刺 50 题</b><small>集中刷一轮</small></button>
<button class="card action" onclick="wrongStart()"><span class="big">❌</span><b>错题重练</b><small>优先解决薄弱点</small></button>
<button class="card action" onclick="mock()"><span class="big">⏱️</span><b>正式模拟</b><small>50题 · 45分钟</small></button></div>
<div class="title">更多</div><div class="grid">
<button class="card action" onclick="go('practice')"><span class="big">🎯</span><b>自定义练习</b><small>章节、题型、难度、数量</small></button>
<button class="card action" onclick="go('search')"><span class="big">🔎</span><b>搜索题库</b><small>题干、选项、章节都能搜</small></button>
<button class="card action" onclick="go('fav')"><span class="big">⭐</span><b>收藏夹</b><small>重点题单独练</small></button>
<button class="card action" onclick="go('stats')"><span class="big">📊</span><b>成绩分析</b><small>章节表现与学习日历</small></button></div>`;
}
function practice(){let opts=(arr,first)=>'<option value="">'+first+'</option>'+arr.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');
document.getElementById('practice').innerHTML=`<div class="title">自定义练习</div><div class="card"><div class="filters">
<select id="fchapter" class="field full">${opts(chapters(),'全部章节')}</select>
<select id="ftype" class="field">${opts(types(),'全部题型')}</select>
<select id="fdiff" class="field">${opts(diffs(),'全部难度')}</select>
<select id="fcount" class="field"><option>10</option><option selected>20</option><option>30</option><option>50</option><option>100</option><option>200</option></select>
<select id="forder" class="field"><option value="random">随机</option><option value="seq">顺序</option><option value="unanswered">优先未练</option><option value="wrong">只做错题</option></select>
<select id="fmode" class="field"><option value="instant">即时判分</option><option value="exam">整卷后判分</option></select></div>
<button class="btn" style="width:100%;margin-top:9px" onclick="custom()">开始练习</button></div>
<div class="title">题库结构</div><div class="card">${chapters().map(c=>`<div style="margin:10px 0"><div style="display:flex;justify-content:space-between"><span>${esc(c)}</span><b>${Q.filter(q=>q.chapter===c).length}</b></div><div class="bar" style="margin-top:5px"><i style="width:${Q.filter(q=>q.chapter===c).length/Q.length*100}%"></i></div></div>`).join('')}</div>`;}
function pool(f={}){return Q.filter(q=>(!f.c||q.chapter===f.c)&&(!f.t||q.type===f.t)&&(!f.d||q.difficulty===f.d));}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function custom(){let a=pool({c:fchapter.value,t:ftype.value,d:fdiff.value});let n=+fcount.value;if(forder.value==='wrong')a=a.filter(q=>S.wrong[q.id]);else if(forder.value==='unanswered')a=a.filter(q=>!S.answered[q.id]);if(forder.value==='random'||forder.value==='unanswered'||forder.value==='wrong')a=shuffle(a);a=a.slice(0,n);if(!a.length)return toast('没有符合条件的题');start({pool:a,mode:fmode.value});}
function start(o){let a=o.pool||(o.random?shuffle(Q).slice(0,o.n):Q.slice(0,o.n));sess={list:a,i:0,ans:{},checked:{},score:0,mode:o.mode||'instant',kind:o.kind||'practice',start:Date.now(),limit:o.limit||0,submitted:false};go('quiz');renderQuiz();}
function wrongStart(){let a=Object.keys(S.wrong).map(Number).map(id=>Q.find(q=>q.id===id)).filter(Boolean);if(!a.length)return toast('错题本是空的');start({pool:shuffle(a).slice(0,100),kind:'wrong'});}
function mock(){start({pool:shuffle(Q).slice(0,50),kind:'mock',mode:'exam',limit:45*60});}
function ans(q){return String(q.answer||'').trim().toUpperCase();}
function multi(q){return q.type==='多选题';}
function chosen(q){return Array.isArray(sess.ans[q.id])?sess.ans[q.id]:[];}
function toggle(q,l){if(sess.checked[q.id]&&sess.mode!=='exam')return;let a=chosen(q);if(multi(q))a=a.includes(l)?a.filter(x=>x!==l):[...a,l];else a=[l];a.sort();sess.ans[q.id]=a;renderQuiz();}
function correct(q){let a=chosen(q);if(q.type==='判断题')return (a[0]==='A')===(ans(q)==='T');if(q.type==='填空题')return a[0]?.trim()===ans(q);return a.slice().sort().join('')===ans(q).split('').sort().join('');}
function checkCurrent(){let q=sess.list[sess.i],a=chosen(q);if(!a.length)return toast('先选择答案');sess.checked[q.id]=true;let ok=correct(q);record(q,ok);if(sess.mode==='exam')return renderQuiz();renderQuiz();}
function record(q,ok){if(sess.recorded?.[q.id])return;sess.recorded=sess.recorded||{};sess.recorded[q.id]=true;S.attempts++;if(ok){S.right++;delete S.wrong[q.id];}else S.wrong[q.id]=1;S.answered[q.id]=(S.answered[q.id]||0)+1;S.days[today()]=(S.days[today()]||0)+1;save();}
function submitExam(){for(let q of sess.list){if(!chosen(q).length)continue;let ok=correct(q);record(q,ok);sess.checked[q.id]=true;}finish();}
function next(){if(sess.mode==='exam'){if(sess.i<sess.list.length-1){sess.i++;renderQuiz()}else submitExam();}else{if(sess.i<sess.list.length-1){sess.i++;renderQuiz()}else finish();}}
function finish(){let n=sess.list.length,score=sess.list.filter(q=>sess.checked[q.id]&&correct(q)).length;document.getElementById('quiz').innerHTML=`<div class="card examresult"><div class="muted">${sess.kind==='mock'?'模拟考试':'练习完成'}</div><div class="score">${Math.round(score/n*100)}</div><h2>${score}/${n} 正确</h2><p class="muted">正确率 ${Math.round(score/n*100)}%</p></div><div class="grid" style="margin-top:10px"><button class="card action" onclick="wrongStart()">❌<b>重做错题</b><small>趁热巩固</small></button><button class="card action" onclick="start({n:20,random:true})">🎲<b>再刷20题</b><small>继续练</small></button></div><div class="title">本次答题卡</div><div class="card answergrid">${sess.list.map((q,i)=>`<button class="${sess.checked[q.id]?(correct(q)?'right':'wrong'):'answered'}" onclick="sess.i=${i};renderQuiz()">${i+1}</button>`).join('')}</div><button class="btn" style="width:100%;margin-top:12px" onclick="go('home')">回首页</button>`;}
function renderQuiz(){let q=sess.list[sess.i];if(!q)return finish();let left=sess.limit?Math.max(0,sess.limit-Math.floor((Date.now()-sess.start)/1000)):0;if(sess.limit&&left<=0){submitExam();return}if(sess.limit){clearTimeout(window.timer);window.timer=setTimeout(renderQuiz,1000);}
let timer=sess.limit?`<span class="timer">⏱ ${fmt(left)}</span>`:'';let checked=!!sess.checked[q.id]&&!sess.mode==='exam';let arr=q.type==='判断题'?[['A','正确'],['B','错误']]:['A','B','C','D'].map(l=>[l,q.options?.[l.charCodeAt(0)-65]||'']).filter(x=>x[1]);let opts=q.type==='填空题'?`<input id="fill" class="field" placeholder="请输入答案" value="${esc(chosen(q)[0]||'')}" ${sess.mode==='exam'?'':'onchange="sess.ans[${q.id}]=[this.value]"'}>`:arr.map(([l,t])=>{let cls=chosen(q).includes(l)?'sel':'';if(sess.checked[q.id]&&!sess.mode==='exam')cls=correct(q)?'ok':(chosen(q).includes(l)?'bad':'');return `<button class="opt ${cls}" onclick='toggle(${JSON.stringify(q).replace(/'/g,"&#39;")},"${l}")'><span class="letter">${l}</span><span>${esc(t)}</span></button>`}).join('');
let fb='';if(sess.checked[q.id]&&!sess.mode==='exam'){let ok=correct(q);fb=`<div class="fb ${ok?'ok':'bad'}"><b>${ok?'回答正确 ✓':'回答错误 ✗'}</b><br>正确答案：${esc(q.type==='判断题'?(ans(q)==='T'?'正确':'错误'):ans(q))}</div>`;}
document.getElementById('quiz').innerHTML=`<div class="quizbar"><button class="btn ghost" onclick="confirmExit()">← 退出</button><span>${timer}　${sess.i+1}/${sess.list.length}</span></div><div class="progress"><i style="width:${(sess.i+1)/sess.list.length*100}%"></i></div><div class="qcard"><div class="qmeta"><span>${esc(q.type)} · ${esc(q.chapter||'')}</span><button class="btn ghost" style="padding:5px 9px" onclick="fav(${q.id})">${S.fav[q.id]?'⭐ 已收藏':'☆ 收藏'}</button></div><div class="qtext">${esc(q.question)}</div>${opts}${fb}<div class="rowbtn">${sess.i>0?'<button class="btn ghost" onclick="sess.i--;renderQuiz()">上一题</button>':''}<button class="btn" onclick="${sess.mode==='exam'?'next()':(sess.checked[q.id]?'next()':'checkCurrent()')}">${sess.mode==='exam'?(sess.i===sess.list.length-1?'交卷':'下一题'):(sess.checked[q.id]?(sess.i===sess.list.length-1?'完成':'下一题'):'确认答案')}</button></div></div><div class="title">答题卡</div><div class="card answergrid">${sess.list.map((x,i)=>`<button class="${sess.checked[x.id]?(correct(x)?'right':'wrong'):chosen(x).length?'answered':''}" onclick="sess.i=${i};renderQuiz()">${i+1}</button>`).join('')}</div>`;}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function fav(id){S.fav[id]=!S.fav[id];if(!S.fav[id])delete S.fav[id];save();renderQuiz();}
function wrong(){let ids=Object.keys(S.wrong);document.getElementById('wrong').innerHTML=`<div class="title">错题本 <span class="muted">(${ids.length})</span></div><div class="rowbtn"><button class="btn" onclick="wrongStart()">随机重练</button><button class="btn ghost" onclick="clearWrong()">清空错题</button></div><div class="list" style="margin-top:10px">${list(ids)}</div>`;}
function favPage(){let ids=Object.keys(S.fav);document.getElementById('fav').innerHTML=`<div class="title">收藏夹 <span class="muted">(${ids.length})</span></div><div class="list">${list(ids,'暂无收藏')}</div>`;}
function list(ids,empty='暂无内容'){let a=ids.map(Number).map(id=>Q.find(q=>q.id===id)).filter(Boolean);if(!a.length)return `<div class="empty">${empty}</div>`;return a.map(q=>`<div class="item" onclick="openOne(${q.id})"><span class="pill">${esc(q.type)}</span><p><b>${esc(q.question)}</b></p><small class="muted">${esc(q.chapter||'')} · 答案 ${esc(ans(q))}</small></div>`).join('');}
function openOne(id){let q=Q.find(x=>x.id===id);start({pool:[q],kind:'single'});}
function clearWrong(){if(confirm('清空全部错题？')){S.wrong={};save();wrong();}}
function search(){document.getElementById('search').innerHTML=`<div class="title">搜索题库</div><input id="searchBox" class="field" placeholder="搜索题干、选项、章节..." oninput="doSearch()"><div id="searchList" class="list" style="margin-top:10px"><div class="empty">输入关键词开始搜索</div></div>`;}
function doSearch(){let v=(searchBox.value||'').trim().toLowerCase();let a=v?Q.filter(q=>[q.question,q.chapter,q.type,q.difficulty,...(q.options||[])].join(' ').toLowerCase().includes(v)).slice(0,100):[];searchList.innerHTML=a.length?list(a.map(q=>q.id)):'<div class="empty">'+(v?'没有找到匹配题目':'输入关键词开始搜索')+'</div>';}
function stats(){let total=S.attempts||0,acc=total?Math.round(S.right/total*100):0;let ch=chapters().map(c=>{let ids=Q.filter(q=>q.chapter===c).map(q=>q.id),done=ids.filter(id=>S.answered[id]).length,bad=ids.filter(id=>S.wrong[id]).length;return {c,done,bad,n:ids.length}});let days=Object.entries(S.days).sort().slice(-14);document.getElementById('stats').innerHTML=`<div class="title">学习统计</div><div class="stats"><div class="stat"><b>${total}</b><span>累计作答</span></div><div class="stat"><b>${acc}%</b><span>总正确率</span></div><div class="stat"><b>${Object.keys(S.answered).length}</b><span>做过题</span></div><div class="stat"><b>${Object.keys(S.wrong).length}</b><span>当前错题</span></div></div><div class="card"><b>最近14天</b>${days.length?days.map(([d,n])=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--l)"><span>${d}</span><b>${n}题</b></div>`).join(''):'<p class="muted">还没有学习记录</p>'}</div><div class="title">章节表现</div><div class="card">${ch.map(x=>`<div style="margin:11px 0"><div style="display:flex;justify-content:space-between;font-size:13px"><span>${esc(x.c)}</span><span>已做 ${x.done}/${x.n} · 错题 ${x.bad}</span></div><div class="bar" style="margin-top:5px"><i style="width:${x.n?x.done/x.n*100:0}%"></i></div></div>`).join('')}</div>`;}
function settings(){document.getElementById('sheet').innerHTML=`<h3>设置与数据</h3><div class="stack"><button class="btn" onclick="exportData()">导出学习记录</button><button class="btn secondary" onclick="document.getElementById('file').click()">导入学习记录</button><button class="btn ghost" onclick="install()">安装到手机桌面</button><button class="btn ghost" onclick="setDaily()">设置每日目标</button><button class="btn danger" onclick="reset()">清空全部学习记录</button><input id="file" type="file" accept=".json" hidden onchange="importData(this.files[0])"><p class="muted" style="font-size:12px;line-height:1.6">题库本身固定内置 2337 题。学习记录只保存在本设备浏览器中；导出 JSON 可以换手机后恢复。</p></div>`;document.getElementById('modal').classList.add('on');}
function closeModal(){document.getElementById('modal').classList.remove('on');}
function exportData(){let b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='军理刷题学习记录.json';a.click();toast('已导出');}
function importData(f){if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.attempts)throw 0;S=Object.assign({},defaults,x);save();closeModal();home();toast('学习记录已恢复')}catch(e){toast('文件无效')}};r.readAsText(f);}
function setDaily(){let n=prompt('每天刷多少题？',S.plans.daily);if(n&&+n>0){S.plans.daily=Math.min(1000,+n);save();closeModal();home();}}
function reset(){if(confirm('确定清空所有错题、收藏、统计和学习记录吗？题库不会删除。')){S=JSON.parse(JSON.stringify(defaults));save();closeModal();home();toast('已清空');}}
function confirmExit(){if(confirm('确定退出当前练习？本次未提交的答题进度不会计入成绩。'))go('home');}
function install(){if(installPrompt){installPrompt.prompt();installPrompt.userChoice.then(()=>installPrompt=null)}else toast('请使用浏览器菜单中的“添加到主屏幕/安装应用”');}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
go('home');
</script>
</body></html>
